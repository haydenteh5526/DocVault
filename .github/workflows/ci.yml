name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docvault_test
          POSTGRES_USER: docvault
          POSTGRES_PASSWORD: docvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/dev-requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Audit production dependencies
        run: cd backend && pip-audit -r requirements.txt

      - name: Lint
        run: cd backend && ruff check app/ tests/

      - name: Verify migration round trip
        env:
          DATABASE_URL: postgresql://docvault:docvault@localhost:5432/docvault_test
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://docvault:docvault@localhost:5432/docvault_test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: documents
          JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
          OCR_BACKEND: tesseract
        run: cd backend && pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=65

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc -b

      - name: Lint
        run: cd frontend && npm run lint

      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: Test
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: cd mobile && npm ci

      - name: Type check
        run: cd mobile && npm run typecheck

      - name: Validate Expo configuration
        run: cd mobile && npm run doctor

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docvault_test
          POSTGRES_USER: docvault
          POSTGRES_PASSWORD: docvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: cd backend && pip install -r requirements.txt

      - name: Start object storage and install OCR engine
        run: |
          docker run --detach --name e2e-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              break
            fi
            echo "waiting for MinIO ($i)"
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live > /dev/null
          if ! command -v tesseract > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://docvault:docvault@localhost:5432/docvault_test
        run: cd backend && alembic upgrade head

      - name: Seed verified E2E account
        env:
          DATABASE_URL: postgresql+asyncpg://docvault:docvault@localhost:5432/docvault_test
          JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
          ALLOW_E2E_SEED: "true"
          E2E_SEED_EMAIL: e2e-verified@example.com
          E2E_SEED_PASSWORD: TestPass123!
        run: cd backend && python scripts/seed_e2e_user.py

      - name: Start API
        env:
          DATABASE_URL: postgresql+asyncpg://docvault:docvault@localhost:5432/docvault_test
          JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
          OCR_BACKEND: tesseract
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: documents
          FRONTEND_URL: http://localhost:3000
        run: |
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then echo "API is up"; break; fi
            echo "waiting for API ($i)"; sleep 1
          done
          curl -sf http://localhost:8000/health > /dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_EMAIL: e2e-verified@example.com
          E2E_PASSWORD: TestPass123!
        run: cd frontend && npx playwright test

      - name: Print API log on failure
        if: failure()
        run: cat /tmp/api.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    env:
      AWS_REGION: eu-west-1
      ECS_CLUSTER: docvault-cluster
      API_SERVICE: docvault-api
      WORKER_SERVICE: docvault-worker
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Tag with the commit SHA as well as :latest so a running task can be
      # traced back to a specific commit.
      - name: Build and push API image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/docvault-api"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" ./backend
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # Both services run the same image, so both must be redeployed — otherwise
      # the worker keeps processing uploads with stale code.
      - name: Redeploy API and worker services
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" \
            --service "$API_SERVICE" --force-new-deployment >/dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" \
            --service "$WORKER_SERVICE" --force-new-deployment >/dev/null

      # Fail the pipeline if a new task crash-loops instead of reporting success.
      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$API_SERVICE" "$WORKER_SERVICE"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Check frontend deploy targets are configured
        run: |
          if [ -z "${{ vars.FRONTEND_BUCKET }}" ] || [ -z "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "::error::Set the FRONTEND_BUCKET and CLOUDFRONT_DISTRIBUTION_ID repository variables"
            echo "Get them with: terraform output frontend_bucket / cloudfront_distribution_id"
            exit 1
          fi

      # Hashed asset filenames can be cached indefinitely; index.html must not be,
      # or clients keep loading the previous build's asset references.
      - name: Publish frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/" >/dev/null

